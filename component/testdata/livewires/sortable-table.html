      <lw-sortable-list aria-label="Member requirements">
        <table class="table--lined">
          <caption>Member requirements</caption>
          <thead>
            <tr>
              <th scope="col"><span class="visually-hidden">Order</span></th>
              <th scope="col">Member practice</th>
              <th scope="col">Shared purpose</th>
              <th scope="col"><span class="visually-hidden">Position controls</span></th>
            </tr>
          </thead>
          <tbody data-sortable-list>
            <tr data-sortable-item data-item-id="orientation" data-item-label="Member orientation">
              <td><span data-sortable-actions><button type="button" data-sortable-handle aria-label="Move Member orientation" title="Drag or press Space to stage">⠿</button></span></td>
              <th scope="row" data-sortable-content>Member orientation</th>
              <td data-th="Shared purpose">Welcome people into the co-op and how members work together.</td>
              <td data-th="Position"><span data-sortable-actions><button type="button" data-sortable-move="up" aria-label="Move Member orientation up">↑</button><button type="button" data-sortable-move="down" aria-label="Move Member orientation down">↓</button></span></td>
            </tr>
            <tr data-sortable-item data-item-id="agreements" data-item-label="Shared agreements">
              <td><span data-sortable-actions><button type="button" data-sortable-handle aria-label="Move Shared agreements" title="Drag or press Space to stage">⠿</button></span></td>
              <th scope="row" data-sortable-content>Shared agreements</th>
              <td data-th="Shared purpose">Review the agreements members use to work together.</td>
              <td data-th="Position"><span data-sortable-actions><button type="button" data-sortable-move="up" aria-label="Move Shared agreements up">↑</button><button type="button" data-sortable-move="down" aria-label="Move Shared agreements down">↓</button></span></td>
            </tr>
            <tr data-sortable-item data-item-id="governance" data-item-label="Governance participation">
              <td><span data-sortable-actions><button type="button" data-sortable-handle aria-label="Move Governance participation" title="Drag or press Space to stage">⠿</button></span></td>
              <th scope="row" data-sortable-content>Governance participation</th>
              <td data-th="Shared purpose">Take part in a member meeting or decision round.</td>
              <td data-th="Position"><span data-sortable-actions><button type="button" data-sortable-move="up" aria-label="Move Governance participation up">↑</button><button type="button" data-sortable-move="down" aria-label="Move Governance participation down">↓</button></span></td>
            </tr>
          </tbody>
        </table>
        <p data-sortable-status role="status" aria-live="polite" aria-atomic="true" tabindex="-1"></p>
      </lw-sortable-list>
