<details class="dropdown dropdown--panel">
  <summary class="trigger button button--small">
    <span>Circles</span>
    <span class="text-muted">All</span>
    <svg class="icon chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
  </summary>
  <form class="menu" method="get">
    <div class="body" role="group" aria-label="Filter by circle">
      <label class="checkbox">
        <input type="checkbox" name="circle" value="design">
        <span>Design</span>
        <span class="text-muted">12<span class="visually-hidden"> members</span></span>
      </label>
      <label class="checkbox">
        <input type="checkbox" name="circle" value="engineering">
        <span>Engineering</span>
        <span class="text-muted">8<span class="visually-hidden"> members</span></span>
      </label>
      <label class="checkbox">
        <input type="checkbox" name="circle" value="operations">
        <span>Operations</span>
        <span class="text-muted">3<span class="visually-hidden"> members</span></span>
      </label>
    </div>
    <footer class="cluster cluster-between">
      <button type="reset" class="button button--small">Clear all</button>
      <button type="submit" class="button button--small button--accent">Apply</button>
    </footer>
  </form>
</details>
